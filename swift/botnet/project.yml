name: BotNet
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BotNet:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywatch.botnet
