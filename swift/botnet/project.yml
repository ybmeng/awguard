name: BotNet
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  BotNet:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywatch.botnet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UF6JUCLS78
  # Renders the real views to PNG offscreen (dev/snapshot.sh) so UI changes can
  # be reviewed without screen-recording permission. Shares Sources with the
  # app, minus its @main.
  Snapshot:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes: [BotNetApp.swift]
      - path: dev/Snapshot
    settings:
      base:
        PRODUCT_NAME: snapshot
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UF6JUCLS78
